<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fixture: Scroll</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #chat { height: 150px; width: 300px; overflow: auto; border: 1px solid #ccc; }
        #chat p { margin: 0; padding: 4px; }
        #spacer { height: 2000px; }
        #feed { list-style: none; margin: 0; padding: 0; }
        #feed li { height: 250px; border-bottom: 1px solid #eee; }
        #sentinel { height: 1px; }
    </style>
</head>
<body>
    <h1>Fixture scroll</h1>
    <div id="chat"></div>
    <div id="spacer"></div>
    <button id="far-button" type="button">Far away button</button>
    <ul id="feed"></ul>
    <div id="sentinel"></div>
    <p id="feed-status">Loaded 5</p>

    <script>
        const chat = document.getElementById("chat");
        for (let i = 1; i <= 30; i++) {
            const line = document.createElement("p");
            line.textContent = `Message ${i}`;
            chat.appendChild(line);
        }

        // Infinite-scroll feed: each time the sentinel scrolls into view, load 5 more items
        // (up to 3 extra batches), like a real "load more on scroll" page.
        const feed = document.getElementById("feed");
        const status = document.getElementById("feed-status");
        const MAX_BATCHES = 3;
        let loaded = 0;
        let batches = 0;
        let loading = false;

        function addItems() {
            for (let i = 0; i < 5; i++) {
                loaded += 1;
                const item = document.createElement("li");
                item.id = `item-${loaded}`;
                item.textContent = `Item ${loaded}`;
                feed.appendChild(item);
            }
        }

        addItems();

        new IntersectionObserver((entries) => {
            if (!entries[0].isIntersecting || loading || batches >= MAX_BATCHES) {
                return;
            }

            loading = true;
            setTimeout(() => {
                addItems();
                batches += 1;
                loading = false;
                status.textContent = batches >= MAX_BATCHES ? "All items loaded" : `Loaded ${loaded}`;
            }, 200);
        }).observe(document.getElementById("sentinel"));
    </script>
</body>
</html>
