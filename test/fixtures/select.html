<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fixture: Select</title>
</head>
<body>
    <h1>Fixture select</h1>

    <label for="country">Country</label>
    <select id="country" name="country">
        <option value="">Choose...</option>
        <option value="us">United States</option>
        <option value="ca">Canada</option>
        <option value="mx" disabled>Mexico</option>
    </select>
    <p id="country-output"></p>

    <label for="toppings">Toppings</label>
    <select id="toppings" name="toppings" multiple size="3">
        <option value="cheese">Cheese</option>
        <option value="olives">Olives</option>
        <option value="peppers">Peppers</option>
    </select>

    <script>
        document.getElementById("country").addEventListener("change", (event) => {
            document.getElementById("country-output").textContent = `Selected: ${event.target.value}`;
        });
    </script>
</body>
</html>
